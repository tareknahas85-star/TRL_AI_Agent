name: agent

on:
  workflow_dispatch:
    inputs:
      job:
        description: Opaque job id (the task itself is fetched from the gate, never stored here)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: agent-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run agent
        # Inputs go through env, never interpolated into the script.
        env:
          JOB: ${{ inputs.job }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          GATE_URL: ${{ secrets.GATE_URL }}
          GATE_KEY: ${{ secrets.GATE_KEY }}
        run: node relay/runner/runner.mjs